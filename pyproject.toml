[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-status-report-agent"
version = "0.1.0"
description = "Geração de Status Reports executivos de QA a partir do workbook Excel fixo do projeto."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
qa-status-report = "qa_status_report.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
qa_status_report = ["presentation/*.mjs"]
